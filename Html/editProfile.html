<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - Edit profile</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/editProfile.css">
</head>
<body>
     <div id="header-login"></div>

    <div class="edit-profile-section">

        <h3 class="Change-prof-title">EDITAR PERFIL</h3>

        <div class="photo-change-profile">
             <img class="imgProfChange" src="/Image/perfil.png" alt="">
             <button class="btn-PhotoProf">Cambiar foto</button>
        </div>

        <form class="fill-chage-profile">
            <label>NOMBRE COMPLETO</label>
            <input type="text" class="new-name">
            <label>NICK NAME</label>
            <input type="text" class="new-nick-name">
            <label>FECHA DE NACIMIENTO</label>
            <input type="date" class="new-date-birth">
            <label>CORREO ELECTRONICO</label>
            <input type="text" class="new-email">
            <label>CONTRASENA</label>
            <input type="text" class="new-password">

        </form>

        <div class="flexBtn">
                    <button class="btn-EditProf"><a class="link" href="/Html/profile.html">REGRESAR</a></button>
                    <button class="btn-EditProf">GUARDAR</button>
        </div>

     </div>
    
</body>

<script src="/js/partial.js"></script>

</html>
