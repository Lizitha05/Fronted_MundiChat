<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - login</title>
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/alerts.css">
</head>

<body>

    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a class="titulo navbar-brand " href="/">
                    MundiChat
                </a>

                <a class="subtitulo navbar-brand " href="/place">
                    Lugares
                </a>
                <a class="subtitulo navbar-brand " href="/">
                    <button type="button" class="btn ">Regresar</button>
                </a>
            </div>

        </nav>
    </header>

     <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card">
            
            
            <h1 class="login-title mb-4">INICIAR SESION</h1>
            
           
            <form class="text-center " action="/feature-login" method="post" id="formLogin">
                
              
                <div class="mb-3">
                    <label class="login-label">Correo electronico</label>
                    <input type="email" class="form-control login-input" placeholder="" name="mailUser" id="inputMail" >
                </div>

                
                <div class="mb-3">
                    <label class="login-label">Contraseña</label>
                    <input type="password" class="form-control login-input" placeholder="" name="passwordUser" id="inputPassword">
                </div>

                
                <p class="register-text">
                    ¿Aun no tienes cuenta? Da click <a href="/register" class="register-link">Registrate</a>
                </p>

                <div class="mt-4 ">
                    <button href="" class="login-btn" type="submit">INGRESAR</button>
                </div>

            </form>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/login.js"></script>
</html>
