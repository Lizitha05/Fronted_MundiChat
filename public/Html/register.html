<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - Register</title>

    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/bootstrap-icons-1.13.1/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="/css/alerts.css">
</head>

<body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a class="titulo navbar-brand " href="/">
                    MundiChat
                </a>

                <a class="subtitulo navbar-brand " href="/place">
                    Lugares
                </a>
                <a class="subtitulo navbar-brand " href="/login">
                    <button type="button" class="btn ">Iniciar sesion</button>
                </a>
            </div>

        </nav>
    </header>


    <div class="register-card d-flex justify-content-center align-items-center min-vh-100">

        <form class="regForm d-flex "  id="formRegister">

            <div class="m-4 ">

                <label for="idFoto" class="form-label"></label>
                <input type="file" id="fileOpeneReg" style="display:none" accept="image/*" name="fileOpeneReg">

                <img id="preview" class="imgReg rounded-circle" src="/Image/default.jfif" alt=""
                    onclick="document.getElementById('fileOpeneReg').click()">


            </div>


            <div class="d-grid">
                <div class="">
                    <h1 class="register-text mb-1">Registro</h1>
                </div>

                <div class="d-flex gap-5">
                    <label class="lReg">Correo electronico</label>

                    <label class="lReg" for="">nickname</label>

                </div>

                <div class="d-flex gap-5 ">
                    <input class="iReg form-control" type="text" name="mail" id="idMail">
                    <input class="iReg form-control" type="text" name="nickname" id="idNickname">
                </div>

                <div class="d-flex gap-5 ">
                    <label class="lReg">Nombre completo</label>


                    <label class="lReg" for="">Fecha de nacimiento</label>

                </div>

                <div class="d-flex gap-5 ">
                    <input class="iReg form-control" type="text" name="nombre" id="idNombre">
                    <input class="iReg form-control" type="date" name="date" id="idDate">
                </div>

                <div class="d-flex gap-5 ">
                    <label class="lReg">Contraseña</label>

                </div>

                <div class="d-flex gap-5 ">

                    <div class="d-flex gap-4">
                    
                        <input class="iReg form-control" type="password" name="password" id="idPassword" autocomplete="new-password">
                        <span class="mostrar-btn" id="togglePassword" style="cursor: pointer;"><i class="bi bi-eye-fill"
                                id="eyeIcon"></i></span>
                    
                    </div>
                   <button class="btn-reg" type="submit">Registro</button>
                </div>



            </div>


        </form>


    </div>


</body>

<script src="/js/register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>

</html>
