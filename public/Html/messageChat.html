<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - Chat Messages</title>

    <script type="module">
        import { io } from "https://cdn.socket.io/4.8.3/socket.io.esm.min.js";

        const socket = io();

        const form = document.getElementById('send-container');
        const input = document.getElementById('message-input')
        const messages = document.getElementById('message-container');

        socket.on('chat message', (msg)=>{
            const item = `<li>${msg}</li>`;
            messages.insertAdjacentHTML('beforeend' , item)
        })
        
        form.addEventListener('submit',(e)=>{
            e.preventDefault();
            if(input.value){
                socket.emit('chat message' , input.value);
                input.value = '';
            }
        })
    </script>
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/messageChat.css">
</head>

<body>

   
    <div id="header-login"></div>

    <div class="chatConteiner">
        <div class="wrapperFirst">

            <div class="conteinerChats">
                <div class="chatUser">
                    <img src="/Image/perfil1.png" alt="">
                    <div class="content">
                        <label class="lChat" for="">Karen Abigail Guerra Lozano</label>

                        <input class="iChat" type="text" value="Eh we,pescado!" disabled>
                    </div>
                </div>

                <div class="chatUser">
                    <img src="/Image/perfil1.png" alt="">
                    <div class="content">
                        <label class="lChat" for="">Karen Abigail Guerra Lozano</label>

                        <input class="iChat" type="text" value="Eh we,pescado!" disabled>
                    </div>
                </div>

                <div class="chatUser">
                    <img src="/Image/perfil1.png" alt="">
                    <div class="content">
                        <label class="lChat" for="">Karen Abigail Guerra Lozano</label>

                        <input class="iChat" type="text" value="Eh we,pescado!" disabled>
                    </div>
                </div>
            </div>
        </div>

        <div class="wrapperSecond">

            <div class="message">

                <div id="message-container"></div>

</body>
