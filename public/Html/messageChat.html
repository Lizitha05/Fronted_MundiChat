<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - Mensajes</title>
  
  

     <link rel="stylesheet" href="/bootstrap-icons-1.13.1/bootstrap-icons.css">
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/messageChat.css">
</head>

<body>
<script src="/js/check.js"></script>


    <div id="header-login"></div>

    <div class="chatConteiner">
        <div class="wrapperFirst">
            <div class="usuarios-header">
                <h5>Contactos</h5>
                <input type="text" id="buscarUsuario" class="form-control" placeholder="Buscar usuario...">

             
            </div>
            <div id="contenedor-usuarios">
                <!-- Todos los usuarios se cargarán aquí -->
                <div class="text-center p-3">Cargando contactos...</div>
            </div>
        </div>

        <div class="wrapperSecond">


            <!-- Contenedor de videollamada (inicialmente oculto) -->
<div id="video-call-container" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center;">
    
    <div style="position: relative; width: 80%; max-width: 800px;">
        <!-- Video del remoto (grande) -->
        <video id="remote-video" autoplay playsinline style="width: 100%; border-radius: 10px; background: #333;"></video>
        
        <!-- Video local (pequeño, esquina) -->
        <video id="local-video" autoplay playsinline muted style="position: absolute; bottom: 20px; right: 20px; width: 200px; border-radius: 10px; border: 2px solid white; background: #333;"></video>
    </div>
    
    <!-- Controles -->
    <div style="margin-top: 20px; display: flex; gap: 15px;">
        <button onclick="toggleMic()" class="btn btn-light">
            <i class="bi bi-mic-fill"></i> Mic
        </button>
        <button onclick="toggleCamera()" class="btn btn-light">
            <i class="bi bi-camera-video-fill"></i> Cámara
        </button>
        <button onclick="finalizarLlamada()" class="btn btn-danger">
            <i class="bi bi-telephone-x-fill"></i> Colgar
        </button>
    </div>
</div>

<!-- Botón para iniciar llamada en el header del chat -->
<!-- Agrega esto en tu #chat-header o cerca -->
<button id="btn-llamar" class="btn btn-success" style="margin-left: auto;">
    <i class="bi bi-telephone-fill"></i> Llamar
</button>
            
            <div id="chatSection" style="display:none;">


                <div class="chat-header" id="chat-header">
                    <!-- Información del chat actual -->

                    
                </div>
                <div class="message">
                    <div id="message-container"></div>
                    <div class="sendMessage">
                        <form id="send-container">
                            <input class="imessage" type="text" id="message-input" placeholder="Escribe un mensaje...">
                            <button class="btnSend" id="send-button">
                                <i class="imgSend bi bi-send-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div id="noChatSeleccionado" style="display:flex; justify-content:center; align-items:center; height:100%;">
                <p>Selecciona un contacto para empezar a chatear</p>
            </div>
        </div>
    </div>

   <!--    <script type="module" src="/js/callChat.js"></script> -->
    <script type="module" src="/js/messageChat.js"></script>
    <script src="/js/partial.js"></script>
    <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
  
</body>

</html>
