<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - Chat Messages</title>
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/bootstrap-icons-1.13.1/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/messageChat.css">
    <link rel="stylesheet" href="/css/alerts.css">
</head>

<body>

    <div id="header-login"></div>


    <div class="chatConteiner d-flex align-items-center justify-content-center gap-3">
        <div class="wrapperFirst m-1 p-1">
            <div class="conteinerChats overflow-auto">

                <div class="chatUser d-flex align-items-center p-3 rounded-5 shadow-sm">
                    <img class="rounded-circle" src="/Image/perfil1.png" alt="" width="50" height="50">
                    <div class="content">
                        <label class="form-label mb-1" for="">Karen Abigail Guerra Lozano</label>
                        <input class="form-control rounded-2 p-2" type="text" value="Eh we,pescado!" disabled>
                    </div>
                </div>

                <div class="chatUser d-flex align-items-center gap-3 p-3 rounded-5 shadow-sm">
                    <img class="rounded-circle" src="/Image/perfil1.png" alt="" width="50" height="50">
                    <div class="content">
                        <label class="form-label mb-1" for="">Karen Abigail Guerra Lozano</label>
                        <input class="form-control rounded-2 p-2" type="text" value="Eh we,pescado!" disabled>
                    </div>
                </div>
                   
                
                

            </div>
        </div>
        <div class="wrapperSecond">

            <div class="headerChat d-flex justify-content-first align-content-center p-4 m-4 gap-2">
                <img class="rounded-circle" src="/Image/perfil1.png" alt="" width="70px" height="70px" r>
                <input class="iHeader input-group border-0 p-4" type="text" value="Karen Abigail Guerra Lozano">
            </div>

            <div class="message ">

                <div class="userDialogs  overflow-auto p-5 m-5">

                    <div class="userOne d-grid justify-content-first align-items-first m-5">
                        <label class="lUserName form-label m-1 p-1 " for="text">Karen Abigail Guerra Lozano</label>

                        <input class="iTextChat input-group m-1 p-4 rounded-4" type="text" value="Eh we pescado"
                            disabled>
                    </div>

                    <div class="userTwo d-grid justify-content-end align-items-end m-5">
                        <label class="lUserName form-label m-1 p-1" for="text">Andreiy Medrano Garzia</label>

                        <input class="iTextChat input-group m-1 p-4 rounded-4" type="text" value="que pasho?" disabled>
                    </div>




                </div>

                <div class="sendMessage d-flex justify-content-center align-content-center gap-4 p-4  ms-5">

                    <label class="iDoc d-flex justify-content-center align-items-center " style="cursor: pointer;">
                        <input type="file" name="" id="" hidden>
                        <i class="bi bi-archive-fill p-3 rounded-2" id="archive"></i>
                    </label>


                    <input class="mensaje input-group-text" type="text">

                    <button class="btn rounded-circle m-1"><i class="bi bi-send-fill"></i></button>
                </div>

            </div>

        </div>
    </div>

</body>

<script src="/js/partial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>

</html>
