<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiChat - Edit profile</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/editProfile.css">
</head>
<body>
     <div id="header-login"></div>

     
    <div class="profile-card d-flex justify-content-center align-items-center  mt-4 ">

        <form class="formProfile d-grid place-items-center" id="formProf">

             <h1 class="profile-text text-center">Editar perfil</h1>

            <div class="wrapperImg">

                <label for="idFoto" class="form-label"></label>
                <input type="file" id="fileOpeneReg" style="display:none" accept="image/*" name="fileOpeneReg">
                <img class="imgProf rounded-circle" id="img"  src="" alt="" width="300" height="300" onclick="document.getElementById('fileOpeneReg').click()">

            </div>
            
        
            <div class="form-floating mt-2">

                <input type="text" class="form-control mt-2" id="idNombre" name="nombreCompleto">
                <label for="floatingInputDisabled" class="letra">Nombre completo</label>
                
            </div>

             <div class="form-floating mt-2">
                <input type="mail" class="form-control mt-2" id="idMail" name="correoElectronico">
                <label for="floatingInputDisabled" class="letra">Correo electronico</label>

            </div>

             <div class="form-floating mt-2">
                <input type="text" class="form-control mt-2" id="idApodo" name="apodo">
                <label for="floatingInputDisabled" class="letra">Apodo</label>

            </div>

             <div class="form-floating mt-2">
                <input type="date" class="form-control mt-2" id="idCumple" name="cumple">
                <label for="floatingInputDisabled" class="letra">Cumpleaños</label>

            </div>

 

            <div class="mt-3 d-flex justify-content-center align-items-center">

                 <button class="btn-guardar mb-2 p-2" id="" type="submit">Guardar</button>
            </div>
            
            
           
         
        </form>

        

    </div>

    
</body>

<script src="/js/partial.js"></script>
<script src="/js/editProfile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
